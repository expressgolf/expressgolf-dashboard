<!doctype html><html lang="en-GB"><head><meta charset="utf-8">
<style>
@font-face{font-family:B;src:url(fonts/barlow-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:B;src:url(fonts/barlow-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:FK;src:url(fonts/FKGrotesk-Medium.woff2);font-weight:500}
@font-face{font-family:B;src:url(fonts/barlow-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:B;src:url(fonts/barlow-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:BC;src:url(fonts/barlow-condensed-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:BC;src:url(fonts/barlow-condensed-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:BC;src:url(fonts/barlow-condensed-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:BC;src:url(fonts/barlow-condensed-latin-800-italic.woff2);font-weight:800;font-style:italic}
:root{
  --teal:#023C46; --deep:#01252B; --ink:#011A1F; --lime:#85FF85; --cream:#F7F8F0;
  --white:#fff; --mute:rgba(247,248,240,.72); --line:rgba(247,248,240,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink)}
html.clear,html.clear body{background:transparent}
body{font-family:FK,B,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased}
.art{position:relative;overflow:hidden;
  background:
    radial-gradient(120% 70% at 85% 0%, rgba(133,255,133,.10), transparent 55%),
    radial-gradient(90% 60% at 0% 100%, rgba(0,0,0,.45), transparent 60%),
    linear-gradient(180deg,var(--teal) 0%, var(--deep) 100%);}
.trace{position:absolute;inset:0;pointer-events:none}
.trace path{fill:none;stroke:var(--lime);stroke-linecap:round}
.lockup{display:flex;align-items:center}
.lockup img{display:block}
.lockup .div{width:2px;align-self:stretch;background:rgba(247,248,240,.45)}
.eyebrow{font-family:BC;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.title{font-family:BC;font-weight:800;text-transform:uppercase;line-height:.86;color:var(--white);letter-spacing:-.005em}
.sub{font-family:BC;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cream)}
.photo{position:relative;background:#000;border:solid var(--white);box-shadow:0 30px 60px rgba(0,0,0,.45)}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.chips{position:absolute;left:0;bottom:0;display:flex}
.chip{font-family:BC;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:var(--teal);color:var(--white)}
.chip.lime{background:var(--lime);color:var(--teal)}
.k{font-family:BC;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.v{font-family:BC;font-weight:800;text-transform:uppercase;color:var(--white);line-height:1}
.p{color:var(--mute);line-height:1.35}
.qr{background:#fff;display:block}
.pts{display:flex}
.pts div{display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--line);font-family:BC;font-weight:800;color:var(--white)}
.pts div:first-child{background:var(--lime);color:var(--teal);border-color:var(--lime)}
.pts small{font-family:BC;font-weight:700;letter-spacing:.1em;opacity:.8}
.final{background:var(--lime);color:var(--teal)}
.final .k{color:var(--teal)}
.final .v{color:var(--teal)}
.legal{color:rgba(247,248,240,.55)}
table{border-collapse:collapse;width:100%}
td{vertical-align:middle;font-family:BC;font-weight:700;text-transform:uppercase;color:var(--white);border-bottom:2px solid var(--line)}
td.pos{color:var(--lime)} td.pt{text-align:right}
td .w{display:inline-block;background:var(--lime);color:var(--teal);font-weight:800;letter-spacing:.06em;vertical-align:middle}
</style>
<style>
html.clear,html.clear body{background:transparent}
.scrimT{position:absolute;left:0;right:0;top:0;height:900px;background:linear-gradient(180deg,rgba(1,26,31,.88) 0%,rgba(1,26,31,.55) 55%,rgba(1,26,31,0) 100%)}
.scrimB{position:absolute;left:0;right:0;bottom:0;height:700px;background:linear-gradient(0deg,rgba(1,26,31,.9),rgba(1,26,31,0))}
.big{font-family:BC;font-weight:800;text-transform:uppercase;line-height:.88;color:#fff}
.hl{color:var(--lime)}
.row{display:flex;align-items:center;gap:26px;font-family:BC;font-weight:800;text-transform:uppercase;color:#fff}
.tick{width:64px;height:64px;background:var(--lime);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:46px;flex:none}
</style></head><body><div id="root"></div><script src="data.js"></script><script>
const D=window.EG,W=D.week;
const f=new URLSearchParams(location.search).get('f');
const clear=['o1','o2'].includes(f); if(clear)document.documentElement.classList.add('clear');
const L=(h)=>`<div class="lockup" style="gap:22px;height:${h}px"><img src="img/eg_white.svg" style="height:${h*.62}px"><span class="div"></span><img src="img/pb_white.png" style="height:${h}px"></div>`;
const art=(inner)=>`<div class="art" style="width:1080px;height:1920px">${inner}</div>`;
// safe area: x 70-880, y 220-1460 (TikTok UI covers top tabs, right icons, bottom caption)
const S={};
S.o1=()=>`<div style="position:relative;width:1080px;height:1920px"><div class="scrimT"></div>
 <div style="position:absolute;left:70px;top:230px">${L(54)}</div>
 <div style="position:absolute;left:70px;right:150px;top:340px">
  <div class="eyebrow" style="font-size:40px">Free golf comp · Every Monday</div>
  <div class="big" style="font-size:168px;margin-top:16px">Closest<br>to the pin<br><span class="hl">wins.</span></div>
 </div></div>`;
S.o2=()=>`<div style="position:relative;width:1080px;height:1920px"><div class="scrimT"></div>
 <div style="position:absolute;left:70px;top:230px">${L(54)}</div>
 <div style="position:absolute;left:70px;right:150px;top:340px">
  <div class="eyebrow" style="font-size:40px">3.81m from the pin</div>
  <div class="big" style="font-size:168px;margin-top:16px">Think you<br>can get<br><span class="hl">closer?</span></div>
 </div></div>`;
const pin=W.pin, px=pin[0]*1080, py=pin[1]*820;
S.c1=()=>art(`<div style="position:absolute;left:0;top:0;width:1080px;height:820px;overflow:hidden"><img src="${W.photo}" style="width:100%;height:100%;object-fit:cover">
  <svg style="position:absolute;inset:0" viewBox="0 0 1080 820"><path d="M120,820 Q${(120+px)/2},${py-420} ${px},${py}" fill="none" stroke="#85FF85" stroke-width="9" stroke-linecap="round" opacity=".9"/><circle cx="${px}" cy="${py}" r="20" fill="#85FF85"/></svg>
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(1,37,43,.8) 0%,rgba(1,37,43,0) 35%,rgba(1,37,43,0) 70%,var(--teal) 100%)"></div></div>
 <div style="position:absolute;left:70px;top:230px">${L(54)}</div>
 <div style="position:absolute;left:70px;right:150px;top:850px">
  <div class="eyebrow" style="font-size:40px">This Monday · Week ${W.n} of ${W.of}</div>
  <div class="big" style="font-size:150px;margin-top:14px">${W.course}</div>
  <div style="display:flex;margin-top:28px"><div class="chip" style="font-size:62px;padding:14px 28px;background:#012a31">Hole ${W.hole}</div><div class="chip lime" style="font-size:62px;padding:14px 28px">${W.yards} yds</div></div>
  <div class="v" style="font-size:70px;margin-top:44px">${W.dayShort} · <span class="hl">${W.time}</span></div>
  <div class="k" style="font-size:34px;margin-top:40px">This week's prize</div>
  <div class="v" style="font-size:62px;margin-top:6px">${W.prize}</div>
 </div>`);
S.c2=()=>art(`<div style="position:absolute;left:70px;top:230px">${L(54)}</div>
 <div style="position:absolute;left:70px;right:150px;top:560px">
  <div class="eyebrow" style="font-size:40px">How it works</div>
  <div class="big" style="font-size:150px;margin-top:16px">Free to<br>enter.</div>
  <div style="margin-top:70px;display:flex;flex-direction:column;gap:38px">
   <div class="row" style="font-size:64px"><span class="tick">✓</span>Any age, any ability</div>
   <div class="row" style="font-size:64px"><span class="tick">✓</span>One hole, every Monday</div>
   <div class="row" style="font-size:64px"><span class="tick">✓</span>Top 5 score points</div>
   <div class="row" style="font-size:64px"><span class="tick">✓</span>Win a week = semi-final</div>
  </div></div>`);
S.c3=()=>art(`<div style="position:absolute;left:70px;top:230px">${L(54)}</div>
 <div style="position:absolute;left:70px;right:150px;top:600px">
  <div class="eyebrow" style="font-size:40px">${W.of} weeks · One grand final</div>
  <div class="big" style="font-size:150px;margin-top:16px">Play for<br>the big one.</div>
  <div class="final" style="margin-top:70px;padding:48px 50px">
   <div class="k" style="font-size:36px">Grand final prize · April 2027</div>
   <div class="v" style="font-size:104px;margin-top:14px;line-height:.92">Custom-fit irons worth up to £1,500</div>
  </div></div>`);
S.c4=()=>art(`<div style="position:absolute;left:70px;top:230px">${L(54)}</div>
 <div style="position:absolute;left:70px;right:150px;top:600px">
  <div class="eyebrow" style="font-size:40px">${D.comp} · Express Golf, Bradford</div>
  <div class="big" style="font-size:176px;margin-top:16px">Enter<br><span class="hl">free.</span></div>
  <div class="v" style="font-size:66px;margin-top:56px">${W.dayShort} · <span class="hl">${W.time}</span></div>
  <div class="p" style="font-size:44px;margin-top:40px;max-width:780px">Register in the Toptracer Range app, then play Closest to the Pin on any bay.</div>
  <div class="final" style="display:inline-block;margin-top:56px;padding:26px 40px"><div class="v" style="font-size:64px">Link in bio ↑</div></div>
 </div>`);
document.getElementById('root').innerHTML=S[f]();
Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>document.body.dataset.ready=1);
</script></body></html>
